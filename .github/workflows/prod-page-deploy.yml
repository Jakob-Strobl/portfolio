name: Page Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to build
        required: false
        default: main

  workflow_call:
    inputs:
      branch:
        type: string
        description: The branch to build
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      VITE_PUBLIC_POSTHOG_KEY:
        required: true
      VITE_PUBLIC_POSTHOG_HOST:
        required: true
      PRIVATE_POSTHOG_KEY:
        required: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build
        run: bun run cloudflare-step-deploy
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          PRIVATE_POSTHOG_KEY: ${{ secrets.PRIVATE_POSTHOG_KEY }}

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ vars.OUTPUT_DIRECTORY }} --project-name=${{ vars.PAGES_PROJECT_NAME }} --branch=${{ inputs.branch }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ github.token }}
          packageManager: bun
          wranglerVersion: "4.118.0"
